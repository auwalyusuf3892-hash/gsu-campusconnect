name: gsu_campusconnect
description: "Offline-first digital campus ecosystem for Gombe State University, Gombe, Nigeria."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Routing ───────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── Local Storage ─────────────────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # ── Firebase (wired, awaiting google-services.json) ───────────────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_crashlytics: ^4.0.4

  # ── Map Engine ────────────────────────────────────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ── Location & Navigation ─────────────────────────────────────────
  geolocator: ^13.0.1

  # ── Camera / QR Scanner ───────────────────────────────────────────
  mobile_scanner: ^5.2.3

  # ── Connectivity ──────────────────────────────────────────────────
  connectivity_plus: ^6.0.3

  # ── Pedometer ─────────────────────────────────────────────────────
  pedometer: ^4.0.1
  permission_handler: ^11.3.1

  # ── Cryptography (PIN hashing) ────────────────────────────────────
  crypto: ^3.0.5

  # ── URL Launcher (About GSU screen) ──────────────────────────────
  url_launcher: ^6.3.1

  # ── Localization ──────────────────────────────────────────────────
  intl: 0.20.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

# ── Launcher Icons Config ─────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/ic_launcher_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0E693B"
  adaptive_icon_foreground: "assets/icons/ic_foreground.png"
  web:
    generate: false

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/data/
    - assets/handbook/
    - assets/map_tiles/